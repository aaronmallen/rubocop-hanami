Hanami/SliceExports:
  Description: Checks that each slice exports a literal list of allowed keys.
  Enabled: true
  VersionAdded: "0.1.0"
  Include:
    - "**/config/slices/*.rb"
    - "**/slices/*/config/slice.rb"
  AllowedExports: []
  ForbiddenExports: []
  ParentClasses:
    - Hanami::Slice
  RequireExport: true

Hanami/ContainerLookup:
  Description: Checks for container lookups where `include Deps[...]` would do.
  Enabled: true
  VersionAdded: "0.2.0"
  Include:
    - "app/**/*.rb"
    - "slices/**/*.rb"
    - "lib/**/*.rb"
  Exclude:
    - "config/**/*"
    - "slices/*/config/**/*"
    - "spec/**/*"
  AllowedReceivers: []
