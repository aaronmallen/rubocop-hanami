Hanami/SliceExports:
  Description: Checks that each slice exports a literal list of allowed keys.
  Enabled: true
  VersionAdded: "0.1.0"
  Include:
    - "**/config/slices/*.rb"
    - "**/slices/*/config/slice.rb"
  AllowedExports: []
  ForbiddenExports: []
  ParentClasses:
    - Hanami::Slice
  RequireExport: true

Hanami/ContainerLookup:
  Description: Checks for container lookups where `include Deps[...]` would do.
  Enabled: true
  VersionAdded: "0.2.0"
  Include:
    - "app/**/*.rb"
    - "slices/**/*.rb"
    - "lib/**/*.rb"
  Exclude:
    - "config/**/*"
    - "slices/*/config/**/*"
    - "spec/**/*"
  AllowedReceivers: []

Hanami/AppReferenceInSlice:
  Description: Checks for references to `Hanami.app` from a slice.
  Enabled: true
  VersionAdded: "0.2.0"
  Include:
    - "slices/**/*.rb"
  Exclude:
    - "slices/*/config/**/*"
  AppNamespaces: []

Hanami/RelationOutsideRepo:
  Description: Checks for relations in `include Deps[...]` outside a repo.
  Enabled: true
  VersionAdded: "0.2.0"
  Include:
    - "app/**/*.rb"
    - "slices/**/*.rb"
  Exclude:
    - "app/db/**/*"
    - "app/relations/**/*"
    - "app/repos/**/*"
    - "slices/*/config/**/*"
    - "slices/*/db/**/*"
    - "slices/*/relations/**/*"
    - "slices/*/repos/**/*"
  RelationKeyPrefixes:
    - relations.
  ROMKeys:
    - db.rom
    - persistence.rom

Hanami/PersistenceInAction:
  Description: Checks for repos and relations in an action's `include Deps[...]`.
  Enabled: false
  VersionAdded: "0.2.0"
  Include:
    - "**/actions/**/*.rb"
  AllowedKeys: []
  ForbiddenKeyPrefixes:
    - repos.
    - relations.

Hanami/UnusedDeps:
  Description: Checks for keys in `include Deps[...]` that the class never reads.
  Enabled: true
  VersionAdded: "0.2.0"
  Include:
    - "app/**/*.rb"
    - "slices/**/*.rb"
    - "lib/**/*.rb"

Hanami/EnvAccess:
  Description: Checks for `ENV` outside settings and providers.
  Enabled: true
  VersionAdded: "0.2.0"
  Include:
    - "**/*.rb"
  Exclude:
    - "bin/**/*"
    - "config.ru"
    - "config/app.rb"
    - "config/providers/**/*"
    - "config/puma.rb"
    - "config/settings.rb"
    - "db/**/*"
    - "Rakefile"
    - "slices/*/config/providers/**/*"
    - "slices/*/config/settings.rb"
    - "spec/**/*"
